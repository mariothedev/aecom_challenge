<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
      /* While the upload runs, htmx adds .htmx-request to the form: hide the button, show "Uploading". */
      .uploading { display: none; }
      .htmx-request .uploading { display: flex; }
      .htmx-request .idle, .htmx-request #result { display: none; }
    </style>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-neutral-950 p-4 text-neutral-300 antialiased">
    <form class="text-center"
          hx-post="/upload" hx-encoding="multipart/form-data" hx-trigger="change" hx-target="#result"
          hx-on::after-request="this.reset()"
          hx-on::response-error="document.getElementById('result').textContent = 'Upload failed. The server log says why.'">
      <label class="idle inline-block cursor-pointer rounded-lg bg-white px-8 py-3 font-medium text-neutral-950 transition hover:bg-neutral-200">
        Upload
        <input type="file" name="files" accept="application/pdf" multiple class="hidden">
      </label>
      <div class="uploading items-center gap-3 text-white">
        <span class="size-4 animate-spin rounded-full border-2 border-neutral-700 border-t-white"></span>
        Uploading…
      </div>
      <p id="result" class="mt-6 text-sm text-neutral-400"></p>
    </form>
  </body>
</html>
